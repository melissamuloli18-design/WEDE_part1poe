<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry / Reserve Animaliere de la Manika</title>
</head>

<body>

    <header>

        <div class="logo">
            <h1>Reserve Animaliere de la Manika</h1>
        </div>
        <img src="_images/maika-logo.png.jpeg" width="120" height="120" alt="Reserve Animaliere de Manika">

        <nav>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a>Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-header">

            <h2>Enquiry / Booking</h2>

            <p>
                Contact us to plan your visit or enquire about our activities.
            </p>

        </section>

        <section class="form-section">

            <form>

                <label for="name">Full Name:</label>

                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>

                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>

                <input type="tel" id="phone" name="phone">





                <label for="visitors">
                    Number of visitors:
                </label>



                <input typr="numer" id="visitors" name="visitors" min="1">




                <label for="date">
                    Prefered Visit Date:
                </label>

                <input type="date" id="date" name="date">




                <label for="visit=type">
                    Type of Visit:
                </label>

                <select id="visit-type" name="visit-type">




                    <option value="individual">
                        Individual Visit
                    </option>



                    <option value="family">
                        Family Visit
                    </option>




                    <option value="school">
                        School Visit
                    </option>




                    <option value="group">
                        Group Visit
                    </option>




                    <option value="sponsorship">
                        Sponsorship
                    </option>


                </select>

                <label for="message">
                    Message:
                </label>



                <textarea id="message" name="message" rows="6" placeholder="Enter your enquiry here..."></textarea>



                <button type="submit">
                    Submit Enquiry
                </button>



            </form>


        </section>



    </main>

    <footer>

        <p>
            &copy; 2009 Reserve Animaliere de la Manika. All Rights Reserved.
        </p>
    </footer>

</body>

</html>
